<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Capstone Management Portal</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; padding: 24px; border-radius: 8px; max-width: 650px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    h1 { color: #38bdf8; margin-top: 0; }
    .status { padding: 8px 12px; border-radius: 4px; display: inline-block; font-weight: bold; margin-bottom: 20px; }
    .status-ok { background: #065f46; color: #34d399; }
    input, button { padding: 10px; border-radius: 4px; border: 1px solid #475569; margin: 4px 0; }
    input { width: 100%; box-sizing: border-box; background: #0f172a; color: white; }
    button { background: #0284c7; color: white; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    button:hover { background: #0369a1; }
    ul { list-style: none; padding: 0; }
    li { background: #334155; padding: 12px; margin-bottom: 8px; border-radius: 4px; border-left: 4px solid #38bdf8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 DevOps Capstone Portal</h1>
    <div id="status" class="status status-ok">Checking backend connectivity...</div>
    
    <h3>Add Deployment Record</h3>
    <input type="text" id="title" placeholder="Service Name / Deployment Title">
    <input type="text" id="desc" placeholder="Commit SHA / Description">
    <button onclick="addTask()">Submit Record</button>

    <h3>Active Deployment Records</h3>
    <ul id="taskList">Loading records...</ul>
  </div>

  <script>
    const API_BASE = '/api/v1';

    async function checkHealth() {
      try {
        const res = await fetch('/healthz');
        const data = await res.json();
        document.getElementById('status').innerText = 'Backend Health: ' + data.status + ' | DB: ' + data.database;
      } catch (err) {
        document.getElementById('status').innerText = 'Backend Unreachable';
        document.getElementById('status').style.background = '#7f1d1d';
      }
    }

    async function loadTasks() {
      try {
        const res = await fetch(`${API_BASE}/tasks`);
        const data = await res.json();
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        if (data.tasks.length === 0) {
          list.innerHTML = '<li>No records registered yet.</li>';
          return;
        }
        data.tasks.forEach(t => {
          const li = document.createElement('li');
          li.innerHTML = `<strong>${t.title}</strong><br><small>${t.description} - ${new Date(t.created_at).toLocaleString()}</small>`;
          list.appendChild(li);
        });
      } catch (e) {
        console.error(e);
      }
    }

    async function addTask() {
      const title = document.getElementById('title').value;
      const description = document.getElementById('desc').value;
      if (!title) return;
      await fetch(`${API_BASE}/tasks`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description })
      });
      document.getElementById('title').value = '';
      document.getElementById('desc').value = '';
      loadTasks();
    }

    checkHealth();
    loadTasks();
  </script>
</body>
</html>
